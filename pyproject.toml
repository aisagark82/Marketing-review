[project]
name = "brandguard"
version = "0.1.0"
description = "Brand compliance review for public websites and all their assets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "huey>=2.5",
    "pydantic>=2.7",
    "alembic>=1.13",
    "httpx>=0.27",
    "truststore>=0.9",
    "protego>=0.3",
    "defusedxml>=0.7",
    "playwright>=1.49",
    "crawlee[playwright]>=1.0",
    "crawl4ai>=0.7",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
brandguard = "brandguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brandguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
